<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Welcome</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --primary: #4f46e5;
        --primary-dark: #3730a3;
        --shadow: rgba(79, 70, 229, 0.18);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 45%, #e0f2fe 100%);
        color: var(--text);
      }

      .card {
        width: min(92vw, 520px);
        background: var(--card);
        border-radius: 20px;
        padding: 2.5rem 2rem;
        text-align: center;
        box-shadow: 0 24px 60px var(--shadow);
      }

      .badge {
        display: inline-block;
        padding: 0.45rem 0.8rem;
        border-radius: 999px;
        background: #eef2ff;
        color: var(--primary-dark);
        font-weight: 700;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 1.2rem 0 0.8rem;
        font-size: clamp(2.2rem, 5vw, 3.5rem);
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .actions {
        margin-top: 1.75rem;
        display: flex;
        justify-content: center;
        gap: 0.9rem;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-block;
        padding: 0.9rem 1.4rem;
        border-radius: 12px;
        font-weight: 700;
        text-decoration: none;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
      }

      .btn-primary {
        background: var(--primary);
        color: #fff;
        box-shadow: 0 12px 22px rgba(79, 70, 229, 0.28);
      }

      .btn-secondary {
        background: #f3f4f6;
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">Welcome</span>
      <h1>Hello, world!</h1>
      <p>
        Your page is now styled with a clean modern look and a polished landing-page feel.
      </p>

      <div class="actions">
        <a href="#" class="btn btn-primary">Get started</a>
        <a href="#" class="btn btn-secondary">Learn more</a>
      </div>
    </main>
  </body>
</html>
